name: Sync MindMeister

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "roadmap.json"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync MindMeister
        env:
          MINDMEISTER_TOKEN: ${{ secrets.MINDMEISTER_TOKEN }}
        run: node sync-mindmeister.js
